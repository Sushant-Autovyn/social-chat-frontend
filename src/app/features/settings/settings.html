<div class="settings-overlay" (click)="close.emit()"></div>
<div class="settings-modal" role="dialog">
  <header>
    <h2>Settings</h2>
    <button class="x" type="button" (click)="close.emit()" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </header>

  <section class="profile">
    <div class="avatar-edit">
      @if (avatarUrl()) {
        <img class="avatar-preview" [src]="avatarUrl()" alt="avatar" />
      } @else {
        <div class="avatar-preview gradient">{{ initial() }}</div>
      }
      <label [attr.for]="uploadInputId" class="upload-btn">
        @if (uploading()) { Uploading… } @else { Change photo }
      </label>
      <input [id]="uploadInputId" type="file" accept="image/*" hidden (change)="onAvatarChange($event)" />
    </div>

    <label class="field">
      <span>Display name</span>
      <input type="text" [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" placeholder="Your name" />
    </label>

    <label class="field">
      <span>Email</span>
      <input type="email" [value]="user()?.email" disabled />
    </label>
  </section>

  <section>
    <h3>Accent color</h3>
    <div class="accent-grid">
      @for (p of presets; track p.id) {
        <button type="button" class="accent-chip" [class.active]="accent().id === p.id"
          [style.background]="'linear-gradient(135deg, ' + p.from + ', ' + p.to + ')'"
          (click)="pickAccent(p)" [attr.aria-label]="p.name" [title]="p.name">
          @if (accent().id === p.id) {
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          }
        </button>
      }
    </div>
  </section>

  <section>
    <h3>Background</h3>
    <div class="bg-grid">
      <button type="button" class="bg-chip" [class.active]="bg() === 'aurora'" (click)="pickBg('aurora')">
        <span class="swatch aurora" [style.background]="'radial-gradient(circle at 20% 20%, ' + accent().from + '33 0%, transparent 50%), radial-gradient(circle at 80% 80%, ' + accent().to + '33 0%, transparent 50%), #fff'"></span>
        Aurora
      </button>
      <button type="button" class="bg-chip" [class.active]="bg() === 'mesh'" (click)="pickBg('mesh')">
        <span class="swatch mesh" [style.background]="'radial-gradient(circle at 80% 0%, ' + accent().from + '44 0%, transparent 60%), radial-gradient(circle at 0% 100%, ' + accent().to + '44 0%, transparent 60%), #fff'"></span>
        Mesh
      </button>
      <button type="button" class="bg-chip" [class.active]="bg() === 'plain'" (click)="pickBg('plain')">
        <span class="swatch plain"></span>
        Plain
      </button>
    </div>
  </section>

  <section class="row-toggle">
    <div>
      <h3 style="margin: 0;">Dark mode</h3>
      <p class="muted">Easy on the eyes for late-night chats.</p>
    </div>
    <button type="button" class="switch" [class.on]="dark()" (click)="toggleDark()" aria-label="Toggle dark mode">
      <span class="thumb"></span>
    </button>
  </section>

  @if (error()) { <p class="err">{{ error() }}</p> }

  <footer>
    <button class="ghost" type="button" (click)="close.emit()">Close</button>
    <button class="primary" type="button" (click)="save()" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save changes' }}
    </button>
  </footer>
</div>
